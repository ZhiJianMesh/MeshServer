[
{
    "name": "set",
    "method":"POST",
    "property" : "private",
    "feature" : "admin",
    "aclChecker" : "RBAC",
    "tokenChecker" : "USER",
    "comment":"设置某个服务中的权限",
    
    "request": [
        {"name":"uids", "type":"int", "must":true, "min":0, "list":true, "minSize":1, "comment":"用户id"},
        {"name":"service", "type":"string", "must":true, "min":1, "max":30, "comment":"服务名"},
        {"name":"role", "type":"string", "must":true, "min":1, "max":30, "comment":"角色名称"},
        {"name":"power", "type":"string", "must":true, "comment":"权限列表，type1|val1|type2|val2..."}
    ],

    "process" : [
        {
            "name" : "set",
            "type" : "rdb",
            "db": "user",
            
            "sqls" : [
                "replace into powers(uid,service,role,power) values
                 @{FOR|uids, `,`, `(`, e, `,'@{service}','@{role}','@{power}')`}"
            ]
        }
    ],
    "response":[]
},

{
    "name": "get",
    "method":"GET",
    "property" : "private",
    "feature" : "base",
    "tokenChecker" : "BASEUSER",
    "comment":"查询用户在某个服务中的权限，在USER中，
        校验完token后，再用这个token查询power。
        不能定义为OAUTH，因为服务不一定申明了依赖USER服务",

    "request": [
        {"name":"service", "type":"string", "must":true, "min":1, "max":30, "comment":"服务名"}
    ],

    "process" : [
        {
            "name" : "get",
            "type" : "rdb",
            "db": "user",
            
            "sqls" : [{
                "multi":false,
                "merge":true,
                "metas":"each",
                "sql":"select role,power from powers
                 where service='@{service}' and uid=@{#tokenCaller}"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"role", "type":"string", "comment":"角色，服务提供roles.json，通过/xxx/api/roles接口获得"},
            {"name":"power", "type":"string", "comment":"权力定义，tv|tv|...base4格式，每2个标识一个权限，最多64对"}
        ]
    }
},

{
    "name": "remove",
    "method":"DELETE",
    "property" : "private",
    "feature" : "admin",
    "aclChecker" : "RBAC",
    "tokenChecker" : "USER",
    "comment":"清除在某个服务中的权限，但是不能清除自己的权限",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":0, "comment":"用户id"},
        {"name":"service", "type":"string", "must":true, "min":1, "max":30, "comment":"服务名"}
    ],

    "process" : [
        {
            "name" : "remove",
            "type" : "rdb",
            "db": "user",
            
            "sqls" : [
                "delete from powers where uid=@{uid}
                 and service='@{service}' and uid!=@{#tokenCaller}"
            ]
        }
    ],
    "response":[]
},

{
    "name": "getRole",
    "property" : "private",
    "feature" : "base",
    "method":"GET",
    "tokenChecker" : "USER",
    "comment":"获得用户在某个群组中的角色，在端侧直接调用，用于做一些UI的调整。",

    "request": [
        {"name":"service", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,30}$", "comment":"服务名"}
    ],

    "process" : [
        {
            "name" : "getRole",
            "type" : "rdb",
            "db" : "user",

            "sqls" : [{
                 "multi":false,
                 "metas" : "each",
                 "merge":true,
                 "sql":"select p.role,p.power,u.account from powers p,user u
                  where p.service='@{service}' and p.uid=@{#tokenCaller}
                    and u.id=@{#tokenCaller}"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"role", "type":"string", "comment":"角色，服务提供roles.json，通过/xxx/api/roles接口获得"},
            {"name":"power", "type":"string", "comment":"权力定义，tv|tv|...base4格式，每2个标识一个权限，最多64对"},
            {"name":"account", "type":"string", "comment":"帐号"}
        ]
    }
},

{
    "name": "list",
    "method":"GET",
    "property" : "private",
    "feature" : "base",
    "aclChecker" : "RBAC",
    "tokenChecker" : "BASEUSER",
    "comment":"获得一个服务中所有用户的权限及角色",

    "request": [
        {"name":"service", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,30}$", "comment":"服务名"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"查询起始行"},
        {"name":"num", "type":"int", "must":false, "min":5, "max":100, "default":10, "comment":"返回行数"}
    ],

    "process" : [
        {
            "name" : "get_users",
            "type" : "rdb",
            "db" : "user",

            "sqls" : [
                {
                    "name":"users",
                    "multi":true,
                    "metas" : "cols",
                    "merge":false,
                    "sql":"select u.id,u.account,u.nickName,u.ustatus,p.role,p.power
                      from powers p,user u
                     where p.service='@{service}'
                       and u.id=p.uid
                     order by u.id
                     LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"infos",
                    "multi":true,
                    "metas":"kv",
                    "ignores":["NOT_EXISTS"],
                    "sql":"select uid,name,val from info
                      where uid in(@[LIST|!users.0,''])
                        and name like '@{service}_%'"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"users", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，id:用户ID；account:帐号；nickName:昵称；ustatus:N正常，L锁定，R删除；role:角色，服务提供roles.json，通过/xxx/api/roles接口获得；power:权力定义，tv|tv|...base4格式，每2个标识一个权限，最多64对"},
            {"name":"infos", "type":"object", "list":true, "props":[
                {"name":"uid", "type":"int", "comment":"用户ID"},
                {"name":"name", "type":"string", "comment":"信息项的名称，比如homeAddr"},
                {"name":"val", "type":"string", "comment":"内容，比如住址、头像(base64)等"}
            ]}
        ]
    }
},

{
    "name": "getByRoles",
    "method":"GET",
    "property" : "private",
    "feature" : "base",
    "tokenChecker" : "BASEUSER",
    "comment":"获得一个服务中指定角色的用户信息",

    "request": [
        {"name":"service", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,30}$", "comment":"服务名"},
        {"name":"roles", "type":"string", "list":true, "must":true, "regular":"^[a-zA-Z0-9_]{1,30}$", "comment":"角色列表"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"查询起始行"},
        {"name":"num", "type":"int", "must":false, "min":5, "max":100, "default":10, "comment":"返回行数"}
    ],

    "process" : [
        {
            "name" : "get_users",
            "type" : "rdb",
            "db" : "user",

            "sqls" : [{
                "name":"users",
                "multi":true,
                "metas" : "cols",
                "merge":false,
                "sql":"select u.id,u.account,u.nickName,u.ustatus,p.role,p.power
                  from powers p,user u
                 where p.service='@{service}'
                   and p.role in(@{LIST|roles})
                   and u.id=p.uid
                 order by id
                 LIMIT @{num} OFFSET @{offset}"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"users", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，id:sequence(userid)；account:帐号，加密存储；nickName:昵称；ustatus:N:正常，L：锁定，R：删除；role:角色，服务提供roles.json，通过/xxx/api/roles接口获得；power:权力定义，tv|tv|...base4格式，每2个标识一个权限，最多64对"}
        ]
    }
},

{
    "name": "search",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "feature" : "base",
    "comment":"模糊查找帐号及其权限信息",
                
    "request": [
        {"name":"service", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,30}$", "comment":"服务名称"},
        {"name":"s", "type":"str", "must":true, "min":1, "comment":"搜索关键词"},
        {"name":"limit", "type":"int", "must":false, "min":1, "max":100, "default":5, "comment":"最大返回行数"}
    ],

    "process" : [
        {
            "name" : "docs",
            "type" : "search",
            "db": "user",
            "table":"user",
            "action" : "get @{limit}",
            "content" : "@{s}"
        },
        
        {
            "name":"users",
            "type":"rdb",
            "db":"user",
            "sqls":[{
                "name":"users",
                "multi":true,
                "metas" : "cols",
                "sql":"select u.id,u.account,u.nickName,u.ustatus,p.role,p.power
                  from powers p,user u
                 where p.service='@{service}'
                   and p.uid in(@{LIST|!docs})
                   and u.id=p.uid"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"users", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，id:sequence(userid)；account:帐号，加密存储；nickName:昵称；ustatus:N:正常，L：锁定，R：删除；role:角色，服务提供roles.json，通过/xxx/api/roles接口获得；power:权力定义，tv|tv|...base4格式，每2个标识一个权限，最多64对"}
        ]
    }
},

{
    "name": "serviceList",
    "property" : "private",
    "feature" : "base",
    "aclChecker" : "RBAC",
    "tokenChecker" : "USER",
    "method":"GET",
    "comment":"从bios服务获取所有服务的列表",

    "process" : [
        {
            "name" : "get_service_list_from_bios",
            "type" : "call",
            "service": "bios",
            "method":"GET",
            "url":"/service/getList",
            "tokenSign":"APP"
        }
    ]
}
]