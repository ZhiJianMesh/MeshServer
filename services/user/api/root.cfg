[
{
    "name": "login",
    "method":"POST",
    "property" : "public",
    "comment":"此请求来自终端,使用用户名密码认证",

    "request": [
        {"name":"grant_type", "type":"string", "must":false, "default":"password", "options":["password"]},
        {"name":"account", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,30}$", "comment":"帐号"},
        {"name":"password", "type":"string", "must":true, "min":1, "max":100, "comment":"密码"}
    ],

    "process" : [
        {
            "name" : "login_with_pwd",
            "type" : "rdb",
            "db": "user",
            "handler" : "cn.net.zhijian.mesh.builtin.user.Login",
            "comment":"公司用户服务的数据库不分库",
            "sqls" : [
                {
                    "name":"get_user_pwd",
                    "multi":false,
                    "merge":true,
                    "metas": "each",
                    "sql":"select id,pwd from user where account='@{account}' and ustatus='N'"
                },
                {
                    "name":"get_failed_login",
                    "multi":false,
                    "merge":true,
                    "metas":"each",
                    "ignores":["NOT_EXISTS"],
                    "sql":"select val as failed_login from info where uid=@[!id] and name='failed_login'"
                }
            ]
        },
        
        {
            "name" : "save_failed_time",
            "type" : "rdb",
            "db":"user",
            "when":"@{CONDITION|!failed_login,'o.!=',null}",
            "sqls" : [
                "replace into info(uid,name,val) values(@{!id},'failed_login','@{!failed_login}')"
            ],
            //走进这个处理，则一定结束，后面的process不用判断了
            "onSuccess":"{
                \"code\":\"NOT_EXISTS\",
                \"info\":\"account not exists or wrong password\"
            }"
        },
        {
            "name" : "save_token",
            "type" : "rdb",
            "db":"user",
            "sqls" : [
                "replace into token(uid,expiresAt,refToken,tokenHash)
                 values(@{!id},@{!expires_at},'@{!refresh_token}',@{!tokenHash})",
                
                "update user set loginTime=@{#reqAt} where id=@{!id}",
                
                "delete from info where uid=@{!id} and name='failed_login'"
            ]
        }
    ],
    
    "response" : [
        {"name":"access_token", "type":"string", "must":true},
        {"name":"refresh_token", "type":"string", "must":true},
        {"name":"expires_at", "type":"long", "must":true},
        {"name":"token_type", "type":"string", "must":true},
        {"name":"id", "type":"string", "must":true}
    ]
},

{
    "name": "refresh",
    "method":"POST",
    "property" : "private",
    "tokenChecker":"USER",
    "comment":"此请求来自终端,刷新用户token",

    "request": [
        {"name":"grant_type", "type":"string", "must":false, "default":"refresh_token", "options":["refresh_token"]},
        {"name":"refresh_token", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_\\-]{1,30}$", "comment":"刷新token"}
    ],
    
    "process" : [
        {
            "name" : "saveToken",
            "type" : "rdb",
            "db":"user",
            "handler" : "cn.net.zhijian.mesh.builtin.user.Refresh",
            "sqls" : [{
                "name":"get_user_token",
                "multi":false,
                "merge":true,
                "metas":"each",
                "sql":"select tokenHash,expiresAt from token
                     where uid=@{#tokenCaller} and refToken='@{refresh_token}'
                       and expiresAt>@{#reqAt}"
            }]
        },
        {
            "name" : "saveToken",
            "type" : "rdb",
            "db":"user",
            "sqls" : [
                "replace into token(uid,expiresAt,refToken,tokenHash)
                values(@{#tokenCaller},@{!expires_at},'@{!refresh_token}',@{!tokenHash})"
            ]
        }
    ],
    
    "response" : [
        {"name":"access_token", "type":"string", "must":true, "comment":"接入token"},
        {"name":"refresh_token", "type":"string", "must":true, "comment":"刷新token"},
        {"name":"expires_at", "type":"long", "must":true, "comment":"过期时间，UTC"},
        {"name":"token_type", "type":"string", "must":true, "comment":"token类型"},
        {"name":"id", "type":"string", "must":true, "comment":"用户ID"}
    ]
},

{
    "name": "serviceToken",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"此请求来自终端,用user服务的token换取其他服务token，任何用户都可访问，需服务自身控制内部的授权",

    "request": [
        {"name":"service", "type":"string", "must":true,
         "regular":"^[a-zA-Z0-9_:]{1,30}$", "comment":"服务名"},
        {"name":"isCloud", "type":"bool", "must":false, "default":false, "comment":"是否为云侧服务"}
    ],

    "process" : [
        {
            "name" : "getServiceToken",
            "type" : "java",
            "handler" : "cn.net.zhijian.mesh.builtin.user.GetServiceToken"
        }
    ],

    "response" : [
        {"name":"access_token", "type":"string", "must":true, "comment":"接入token"},
        {"name":"expires_at", "type":"long", "must":true, "comment":"过期时间，UTC"},
        {"name":"token_type", "type":"string", "must":true, "comment":"token类型"}
    ]
},

{
    "name": "verify",
    "method":"GET",
    "property" : "public",
    "comment":"验证用户的token是否有效。此请求来自被端侧调用服务的服务侧，不是来自端侧",

    "request": [
        {"name":"access_token", "type":"string", "must":true,
         "min":40, "max":1024, "comment":"验证方从终端请求头中获得的access_token"}
    ],
    "process" : [{
        "name" : "verify",
        "type" : "rdb",
        "db":"user",
        "handler" : "cn.net.zhijian.mesh.builtin.user.Verify",
        "sqls":[{
            "name":"get_token_expiresAt",
            "multi":false,
            "merge":true,
            "metas":"each",
            "sql":"select expiresAt,tokenHash from token
                where uid=@{uid} and expiresAt>@{#reqAt}"
        }]
    }],
    "response":{
        "check":false,
        "segments":[
            {"name":"expiresAt", "type":"long", "comment":"过期时间，UTC"},
            {"name":"tokenHash", "type":"long", "comment":"token摘要"}
        ]
    }
},

{
    "name": "changePassword",
    "method":"POST",
    "property" : "PRIVATE",
    "tokenChecker" : "USER",
    "comment":"此请求来自终端,修改密码",
    "request": [
        {"name":"oldPassword", "type":"string", "must":true, "min":1, "max":100, "comment":"原密码"},
        {"name":"newPassword", "type":"password", "must":true, "rule":"8,2,4,#tokenCaller", "comment":"新密码"},
        {"name":"confirmPassword", "type":"password", "must":true, "equalsTo":"newPassword", "comment":"确认密码，与新密码要一致"}
    ],
    "process" : [
        {
            "name" : "getUserPwd",
            "type" : "rdb",
            "db": "user",
            "sqls" : [{
                "multi": false,
                "merge": true,
                "sql":"select pwd from user where id=@{#tokenCaller}"
            }]
        },
        
        {
            "name" : "updatePwd",
            "type" : "rdb",
            "db":"user",
            "handler" : "cn.net.zhijian.mesh.builtin.user.ChangePwd",
            "sqls" : [
                {
                    "name":"updatePwd",
                    "sql":"update user set pwd='@{PBKDF|10000,newPassword}' where id=@{#tokenCaller}"
                },
                {
                    "name":"removeToken",
                    "sql":"delete from token where uid=@{#tokenCaller}"
                }
            ]
        }
    ],
    "response":[]
},

{
    "name": "logout",
    "method":"DELETE",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"退出登录，删除缓存及数据库中的token",
    "process" : [
        {
            "name" : "token",
            "type" : "rdb",
            "db" : "user",
            "handler" : "cn.net.zhijian.mesh.builtin.user.Logout",
            "sqls" : [
                "delete from token where uid=@{#tokenCaller}
                  and expiresAt=@{expiresAt}"
            ]
        }
    ],
    "response":[]
},

{
    "name": "getName",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"用uid查询帐号与昵称",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":0, "comment":"用户ID"}
    ],

    "process" : [{
        "name" : "get_name_by_uid",
        "type" : "rdb",
        "db":"user",
        "sqls" : [{
            "multi":false,
            "merge":true,
            "metas":"each",
            "sql":"select account,nickName,sex
             from user where id=@{uid} and ustatus='N'"
        }]
    }],
    "response":{
        "check":false,
        "segments":[
            {"name":"account", "type":"string", "comment":"帐号，加密存储"},
            {"name":"nickName", "type":"string", "comment":"昵称"},
            {"name":"sex", "type":"string", "comment":"性别：F女，M男，U未知"}
        ]
    }
},

{
    "name": "setBaseInfo",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"设置用户自己的昵称、手机号、邮箱。此请求来自终端,token是用户token",

    "request": [
        {"name":"nickName", "type":"string", "must":true, "min":1, "max":100, "comment":"昵称"},
        {"name":"sex", "type":"string", "must":true, "options":["M","F","U"], "comment":"性别"},
        {"name":"birthday", "type":"int", "must":true, "min":-25620, "comment":"生日，UTC天，最小为1900年"},
        {"name":"mobile", "type":"string", "must":true, "min":1, "max":100, "comment":"手机号"},
        {"name":"email", "type":"string", "must":true, "min":3, "max":100, "regular":"^.+@.+$", "comment":"邮箱"}
    ],

    "process" : [
        {
            "name" : "setBaseInfo",
            "type" : "rdb",
            "db":"user",
            "sqls" : [
                "update user set
                  nickName='@{nickName}',
                  mobile='@{ENCODE|userKey,mobile}',
                  email='@{ENCODE|userKey,email}',
                  sex='@{sex}',
                  birthday=@{birthday}
                 where id=@{#tokenCaller}"
            ]
        },
        {
            "name" : "update_search",
            "type" : "search",
            "db":"user",
            "action" : "update",
            "table" : "user",
            "did" : "@{#tokenCaller}",
            "summary":"@{nickName} @{SUBSTR|mobile,0,3} @{SUBSTR|mobile,7,4} @{SUBSTR|email,0,5}"
        }
    ],
    "response":[]
},

{
    "name": "getBaseInfo",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "feature" : "user",
    "comment":"查询用户自己的基本信息，此请求来自终端,token是用户token",
    
    "process" : [
        {
            "name" : "baseInfo",
            "type" : "rdb",
            "db":"user",
            "sqls" : [
                {
                    "multi":false,
                    "merge":true,
                    "metas":"each",
                    "sql":"select id,account,nickName,mobile,email,loginTime,ustatus,
                        createAt,birthday,sex,type
                     from user where id=@{#tokenCaller}"
                },
                {
                    "name":"powers",
                    "multi":true,
                    "metas":"kv",
                    "ignores":["NOT_EXISTS"],
                    "sql":"select service,role from powers where uid=@{#tokenCaller}"
                }
            ]
        }
    ],
    
    "response":[
        {"name":"id", "type":"int", "comment":"用户ID"},
        {"name":"account", "type":"string", "comment":"帐号"},
        {"name":"nickName", "type":"string", "comment":"昵称"},
        {"name":"ustatus", "type":"string", "comment":"用户状态"},
        {"name":"mobile", "type":"string", "codeMode":"decode", "keyName":"userKey", "comment":"手机号"},
        {"name":"email", "type":"string", "codeMode":"decode", "keyName":"userKey", "comment":"邮箱"},
        {"name":"loginTime", "type":"long", "comment":"最近登录时间，UTC"},
        {"name":"birthday", "type":"int", "comment":"生日，UTC天"},
        {"name":"sex", "type":"string", "comment":"性别"},
        {"name":"createAt", "type":"long", "comment":"创建时间，UTC"},
        {"name":"type", "type":"string", "comment":"用户类型，I,E,D,A"},
        {"name":"powers", "type":"object", "must":false, "checkAll":false, "comment":"权限，可能没有"}
    ]
},

{
    "name": "removeInfo",
    "method":"DELETE",
    "property" : "private",
    "tokenChecker" : "UNIUSER",
    "comment":"此请求来自终端，设置用户自己的附加信息，这些信息是可删除的，所以name中都增加了r_前缀",

    "request": [
        {"name":"name", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,100}$", "comment":"扩展信息字段名"}
    ],

    "process" : [{
        "name" : "remove_info",
        "type" : "rdb",
        "db":"user",
        "sqls" : [
             "delete from info where uid=@{#tokenCaller} and name='@{name}"
        ]
    }],
    "response":[]
},

{
    "name": "setInfo",
    "method":"PUT",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"此请求来自终端，设置用户自己的附加信息，这些信息是可删除的，所以name中都增加了r_前缀",

    "request": [
        {"name":"name", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,100}$", "comment":"扩展信息字段名"},
        {"name":"val", "type":"string", "must":true, "min":1, "max":4096, "comment":"扩展信息"}
    ],

    "process" : [
        {
            "name" : "set_info",
            "type" : "rdb",
            "db":"user",
            "sqls" : [
                 "replace into info(uid,name,val) 
                 values(@{#tokenCaller},'@{name}','@{val}')"
            ]
        }
    ],
    "response":[]
},

{
    "name": "getInfo",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"查询用户自己的附加信息。此请求来自终端，token是用户token",

    "request": [
        {"name":"name", "type":"string", "must":true, "min":1, "max":100, "comment":"扩展信息字段名"}
    ],

    "process" : [
        {
            "name" : "info",
            "type" : "rdb",
            "db":"user",
            "sqls" : [{
                "multi" : false,
                "merge" : true,
                "sql" : "select val from info where uid=@{#tokenCaller} and name='@{name}'"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"val", "type":"string", "comment":"内容，比如住址、头像(base64)等"}
        ]
    }
},

{
    "name": "getInfos",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"查询用户自己的所有附加信息。此请求来自终端，token是用户token",
    
    "process" : [
        {
            "name" : "infos",
            "type" : "rdb",
            "db":"user",
            "sqls" : [{
                "name" : "infos",
                "multi" : true,
                "metas" : "each",
                "sql" : "select name,val from info where uid=@{#tokenCaller}"
            }]
        }
    ],
    
    "response" : {
        "check":false,
        "segments":[
            {"name":"infos", "type":"object", "list":true, "must":true, "props":[
                {"name":"name", "type":"string", "comment":"扩展信息字段名"},
                {"name":"val", "type":"string", "comment":"扩展信息"}
            ]}
        ]
    }
}
]