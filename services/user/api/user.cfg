{
    "name": "setAppExt",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature":"admin",
    "comment":"设置指定用户在某个服务中的附加信息",
    
    "request": [
        {"name":"service", "type":"string", "must":true, "min":1, "comment":"服务名"},
        {"name":"uid", "type":"int", "must":true, "min":0, "comment":"用户ID"},
        {"name":"val", "type":"string", "must":true, "min":1, "max":4096, "comment":"扩展信息"}
    ],
    
    "process" : [{
        "name" : "get_infos",
        "type" : "rdb",
        "db":"user",
        "sqls" : [
            "replace into info(uid,name,val)
             values(@{uid},'ext_@{service}','@{val}')"
        ]
    }],
    "response":[]
},

{
    "name": "setAppExtTmpl",
    "method":"PUT",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature":"admin",
    "comment":"设置某个服务的模板",

    "request": [
        {"name":"service", "type":"string", "must":true, "min":1, "comment":"服务名"},
        {"name":"tmpl", "type":"string", "must":true, "min":1, "max":4096, "comment":"模板"}
    ],
    
    "process" : [{
        "name": "set_Template",
        "type": "call",
        "service":"config",
        "method":"POST",
        "url":"/putIfAbsent",
        "parameters":"{
            \"k\":\"ext_tmpl_@{service}\",
            \"v\":\"@{tmpl}\"
        }",
        "tokenSign":"APP"
    }],
    "response":[]
},

{
    "name": "initAppExtTmpl",
    "method":"PUT",
    "property" : "private",
    "tokenChecker" : "APP-*",
    "comment":"服务启动时初始化某个服务的默认模板",

    "request": [
        {"name":"tmpl", "type":"string", "must":true, "min":1, "max":4096, "comment":"模板"}
    ],
    
    "process" : [{
        "name": "set_Template",
        "type": "call",
        "service":"config",
        "method":"POST",
        "url":"/putIfAbsent",
        "parameters":"{
            \"k\":\"ext_tmpl_@{#tokenCaller}\",
            \"v\":\"@{tmpl}\"
        }",
        "tokenSign":"APP"
    }],
    "response":[]
},

{
    "name": "getAppExtTmpl",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"获得某个服务的模板，在端侧调用",

    "request": [
        {"name":"service", "type":"string", "must":true, "min":1, "comment":"服务名"}
    ],
    
    "vars": [
        {"name":"name", "val":"ext_tmpl_@{service}"}
    ],
    
    "process" : [{
        "name": "get_Template",
        "type": "call",
        "service":"config",
        "method":"GET",
        "cache":"@{name}",
        "url":"/getWithDefault?k=@{name}&as=template&v={}",
        "tokenSign":"APP"
    }],
    "response":[
         {"name":"template", "type":"json", "comment":"扩展模板"}
    ]
},

{
    "name": "list",
    "method":"GET",
    "property" : "private",
    "feature" : "base",
    "aclChecker" : "RBAC",
    "tokenChecker" : "USER",
    "comment":"按创建先后顺序，分页遍历所有帐号信息",

    "request": [
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"开始行号"},
        {"name":"num", "type":"int", "must":false, "min":5, "max":100, "default":10, "comment":"返回行数"}
    ],

    "process" : [
        {
            "name":"get_users",
            "type":"rdb",
            "db":"user",
            "sqls":[
                {
                    "name":"get_total",
                    "multi":false,
                    "metas" : "each",
                    "merge":true,
                    "sql":"select count(*) total from user"
                },
                {
                    "name":"users",
                    "multi":true,
                    "metas" : "cols",
                    "sql":"select id,account,nickName,type,sex,ustatus from user
                      order by id LIMIT @{num} OFFSET @{offset}"
                }
            ]
        }
    ],

    "response": {
        "check":false,
        "segments":[
            {"name":"total", "type":"int", "comment":"总数"},
            {"name":"users", "type":"object", "list":true, "comment":"用户信息，列名称在cols中，分别为 id:用户ID；account:帐号；nickName:昵称；type:类别；sex:性别；ustatus:状态"},
            {"name":"cols", "type":"string", "list":true, "comment":"列名称"}
        ]
    }
},

{
    "name": "listByApp",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "APP-*",
    "comment":"给其他服务调用，按创建先后顺序，分页遍历所有帐号信息",
                
    "request": [
        {"name":"offset", "type":"int", "must":true, "min":0, "comment":"开始行号"},
        {"name":"num", "type":"int", "must":true, "min":5, "max":100, "comment":"返回行数"}
    ],

    "process" : [
        {
            "name":"get_users",
            "type":"rdb",
            "db":"user",
            "sqls":[
                {
                    "name":"get_total",
                    "multi":false,
                    "metas":"each",
                    "merge":true,
                    "sql":"select count(*) total from user"
                },
                {
                    "name":"users",
                    "multi":true,
                    "metas":"cols",
                    "sql":"select id,account,nickName,type,sex,ustatus from user
                      order by id LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"infos",
                    "multi":true,
                    "metas":"kv",
                    "ignores":["NOT_EXISTS"],
                    "sql":"select uid,name,val from info
                      where uid in(@[LIST|!users.0,''])
                        and name='ext_@{#tokenCaller}'"
                },
                {
                    "name":"roles",
                    "multi":true,
                    "metas":"kv",
                    "ignores":["NOT_EXISTS"],
                    "sql":"select uid,role from powers
                      where service='@{#tokenCaller}'
                       and uid in(@[LIST|!users.0,''])"
                }
            ]
        }
    ],
    
    "response": {
        "check":false,
        "segments":[
            {"name":"total", "type":"int", "comment":"总数"},
            {"name":"users", "type":"object", "list":true, "comment":"用户信息，列名称在cols中，分别为 id:用户ID；account:帐号；nickName:昵称；type:类别；sex:性别；ustatus:状态"},
            {"name":"cols", "type":"string", "list":true},
            {"name":"infos", "type":"object", "must":false},
            {"name":"roles", "type":"object", "must":false}
        ]
    }
},

{
    "name": "search",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "feature" : "base",
    "comment":"模糊查找帐号信息",
                
    "request": [
        {"name":"s", "type":"str", "must":true, "min":1, "comment":"关键词"},
        {"name":"limit", "type":"int", "must":false, "min":1, "max":100, "default":10, "comment":"最大行数"}
    ],

    "process" : [
        {
            "name" : "docs",
            "type" : "search",
            "db": "user",
            "table":"user",
            "action" : "get @{limit}",
            "content" : "@{s}"
        },
        
        {
            "name":"users",
            "type":"rdb",
            "db":"user",
            "sqls":[{
                "name":"users",
                "multi":true,
                "metas" : "cols",
                "sql":"select id,account,nickName,type,sex,ustatus from user
                 where id in(@{LIST|!docs}) and ustatus='N'"
            }]
        }
    ],
    
    "response": {
        "check":false,
        "segments":[
            {"name":"users", "type":"object", "list":true, "comment":"用户信息，列名称在cols中，分别为 id:用户ID；account:帐号；nickName:昵称；type:类别；sex:性别；ustatus:状态"},
            {"name":"cols", "type":"string", "list":true, "comment":"列名称"}
        ]
    }
},

{
    "name": "userid",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "APP-*",
    "comment":"通过帐号列表，批量获取用户ID",

    "request": [
        {"name":"accounts", "list":true, "type":"string", "must":true, "minSize":1, "regular":"^[a-zA-Z0-9_]{3,40}$", "comment":"帐号列表"}
    ],

    "process" : [
        {
            "name" : "ids",
            "type" : "rdb",
            "db":"user",
            "sqls" : [{
                "name":"ids",
                "metas" : "oneCol",
                "multi":true,
                "sql":"select id from user where account in(@{LIST|accounts})"
            }]
        },
        {
            "name" : "check_num",
            "type" : "var",
            "vars":[
                {"name":"idNum", "val":"@{SIZE|!ids}"},
                {"name":"accNum", "val":"@{SIZE|accounts}"}
            ],
            "onSuccess" : {
                "errorCode":"DATA_WRONG",
                "errorInfo":"exists invalid account",
                "condition":"@{CONDITION|accNum, 'i.==', idNum}" 
            }
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"ids", "type":"int", "list":true, "comment":"值列表"}
        ]
    }
},

{
    "name": "account",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"查询当前用户对应的帐号",

    "process" : [{
        "name":"get_account",
        "type":"rdb",
        "db":"user",
        "sqls":[{
            "name":"account",
            "metas":"each",
            "multi":false,
            "merge":true,
            "sql":"select account from user where id=@{#tokenCaller}"
        }]
    }],
    "response":{
        "check":false,
        "segments":[
            {"name":"account", "type":"string", "comment":"帐号"}
        ]
    }
}
]