        ]
    }],
    "response":[]
},

{
    "name": "setBaseInfo",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "USER",
    "feature" : "admin",
    "aclChecker" : "RBAC",
    "comment":"设置指定用户的昵称、手机号、邮箱。此请求来自终端,token是用户token",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":0, "comment":"用户ID"},
        {"name":"nickName", "type":"string", "must":true, "min":1, "max":100, "comment":"昵称"},
        {"name":"mobile", "type":"string", "must":true, "min":1, "max":100, "comment":"手机号"},
        {"name":"sex", "type":"string", "must":false, "options":["M","F"], "comment":"性别"},
        {"name":"type", "type":"string", "must":false, "options":["I","E","D","A"], "comment":"类型"},
        {"name":"birthday", "type":"int", "must":true, "min":-25620, "comment":"生日，UTC天，最小为1900年"},
        {"name":"email", "type":"string", "must":true, "min":3, "max":100, "regular":"^.+@.+$", "comment":"邮箱"}
    ],

    "process" : [
        {
            "name" : "setBaseInfo",
            "type" : "rdb",
            "db":"user",
            "sqls" : [
                "update user set
                  nickName='@{nickName}',
                  mobile='@{ENCODE|userKey,mobile}',
                  email='@{ENCODE|userKey,email}',
                  @{IFVALID|sex, `sex='`, sex, `',`}
                  @{IFVALID|type, `type='`, type, `',`}
                  birthday=@{birthday}
                 where id=@{uid}",

                {
                    "name":"get_account",
                    "metas" : "each",
                    "merge":true,
                    "multi":false,
                    "sql":"select account from user where id=@{uid}"
                }
            ]
        },
        {
            "name" : "update_search",
            "type" : "search",
            "db":"user",
            "action" : "update",
            "table":"user",
            "did" : "@{uid}",
            "title":"@{!account}",
            "summary":"@{nickName}",
            "content":"@{SUBSTR|mobile,0,3} @{SUBSTR|mobile,7,4} @{SUBSTR|email,0,5}"
        }
    ],
    "response":[]
},

{
    "name": "getBaseInfo",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker" : "RBAC",
    "feature" : "base",
    "comment":"管理员查询用户基本信息，此请求来自终端,token是管理员用户token",
    
    "request": [
        {"name":"uid", "type":"int", "must":true, "min":0, "comment":"用户ID"}
    ],
    
    "process" : [
        {
            "name" : "baseInfo",
            "type" : "rdb",
            "db":"user",
            "sqls" : [
                {
                    "multi":false,
                    "merge":true,
                    "metas":"each",
                    "sql":"select account,nickName,mobile,email,loginTime,ustatus,
                        createAt,birthday,sex,type
                     from user where id=@{uid}"
                },
                {
                    "name":"powers",
                    "multi":true,
                    "metas":"each",
                    "ignores":["NOT_EXISTS"],
                    "sql":"select service,role,power from powers where uid=@{uid}"
                }
            ]
        }
    ],
    "response":[
        {"name":"account", "type":"string", "comment":"帐号"},
        {"name":"nickName", "type":"string", "comment":"昵称"},
        {"name":"ustatus", "type":"string", "comment":"状态"},
        {"name":"mobile", "type":"string", "codeMode":"decode", "keyName":"userKey", "comment":"手机号"},
        {"name":"email", "type":"string", "codeMode":"decode", "keyName":"userKey", "comment":"邮箱"},
        {"name":"loginTime", "type":"long", "comment":"登录时间，UTC"},
        {"name":"birthday", "type":"int", "comment":"生日，UTC天"},
        {"name":"sex", "type":"string", "comment":"性别，F女，M男，U未知"},
        {"name":"type", "type":"string", "comment":"类型"},
        {"name":"createAt", "type":"long", "comment":"创建时间，UTC"},
        {"name":"powers", "type":"object", "must":false, "list":true, "checkAll":false, "props":[
           {"name":"service", "type":"string", "comment":"服务名"},
           {"name":"role", "type":"string", "comment":"角色"},
           {"name":"power", "type":"string", "comment":"权限"}
        ]}
    ]
},

{
    "name": "removeInfo",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "USER",
    "feature" : "admin",
    "aclChecker" : "RBAC",
