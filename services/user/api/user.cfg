[
{
    "name": "add",
    "method":"POST",
    "property" : "private",
    "feature" : "admin",
    "aclChecker" : "RBAC",
    "tokenChecker":"USER",
    "comment":"添加新用户，新增公司帐号",

    "request": [
        {"name":"account", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,30}$", "comment":"帐号"},
        {"name":"password", "type":"string", "must":true, "min":1, "max":40, "comment":"密码"},
        {"name":"nickName", "type":"string", "must":true, "min":1, "max":40, "comment":"昵称"},
        {"name":"type", "type":"string", "must":false, "default":"I", "options":["I","E","D","A"], "comment":"类型:I员工，E外部人员，D设备，A智能体"}
    ],

    "process" : [
        {
            "name" : "judge_if_user_exists",
            "type":"dataexists",
            "db":"user",
            "expect" : false, //如果存在，则返回EXISTS，否则返回OK
            "sql":"select * from user where account='@{account}'"
        },
        {
            "name":"get_user_id",
            "type" : "var",
            "vars":[
                {"name":"uid", "val":"@{SEQUENCE|i,'userid'}", "toResp": true}
            ]
        },
        {
            "name" : "register",
            "type" : "rdb",
            "db":"user",
            "sqls" : [
                "insert into user(id,account,nickName,pwd,type,createAt)
                 values(@{uid},'@{account}','@{nickName}','@{PBKDF|6,password}','@{type}',@{NOW})"
            ]
        },
        {
            "name" : "create_search",
            "type" : "search",
            "db":"user",
            "action" : "put",
            "table":"user",
            "did" : "@{uid}",
            "title":"@{account}",
            "summary":"@{nickName}"
        }
    ],

    "response":[
        {"name":"uid", "type":"int", "comment":"用户id"}
    ]
},

{
    "name": "genUid",
    "method":"GET",
    "property" : "private",
    "feature" : "base",
    "tokenChecker":"APP-ihr",
    "comment":"获得一个用户ID，比如在hr系统中，人才未入职时，提前产生用户id，便于后期人才信息与员工信息关联起来",

    "process" : [{
        "name":"get_user_id",
        "type" : "var",
        "vars":[
            {"name":"uid", "val":"@{SEQUENCE|'userid'}", "toResp":true}
        ]
    }],

    "response":[
        {"name":"uid", "type":"int", "comment":"用户id"}
    ]
},

{
    "name": "addByService",
    "method":"POST",
    "property" : "private",
    "feature" : "base",
    "tokenChecker":"APP-ihr",
    "comment":"在某个服务中添加新用户，需要用户服务的管理员确认才可以生效。
        通常用于添加外部用户，比如供应商、客户等",

    "request": [
        {"name":"uid", "type":"int", "must":true, "comment":"用户ID"},
        {"name":"account", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,30}$", "comment":"帐号"},
        {"name":"password", "type":"string", "must":true, "min":1, "max":40, "comment":"密码"},
        {"name":"mobile", "type":"string", "must":true, "min":1, "max":100, "comment":"手机号"},
        {"name":"email", "type":"string", "must":true, "min":3, "max":100, "regular":"^.+@.+$", "comment":"邮箱"},
        {"name":"sex", "type":"string", "must":true, "options":["M","F"], "comment":"性别"},
        {"name":"type", "type":"string", "must":false, "default":"E", "options":["I","E","D","A"], "comment":"类型,I员工，E外部人员，D设备，A智能体"},
        {"name":"nickName", "type":"string", "must":true, "min":1, "max":40, "comment":"昵称"}
    ],

    "process" : [
        {
            "name" : "register",
            "type":"rdb",
            "db":"user",
            "sqls" : [
                {
                    "name": "judge_if_user_exists",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "toResp" : false,
                    "sql": "select exists(select * from user where account='@{account}'
                       union select * from user where id=@{uid}) userExists"
                },
                {
                    "name": "insert_user", //不存在的情况，插入新数据
                    "when":"@[CONDITION|!userExists,'i.==',0]",
                    "sql":"insert into user(id,account,nickName,pwd,createAt,mobile,email,type,sex)
                       values(@{uid},'@{account}','@{nickName}','@{PBKDF|6,password}',
                       @{NOW},'@{ENCODE|userKey,mobile}','@{ENCODE|userKey,email}','@{type}','@{sex}')"
                },
                {
                    "name" : "update_user", //已存在的情况，则更新用户信息。此举是为了解决hr中员工二次入职的问题
                    "when":"@[CONDITION|!userExists,'i.>',0]",
                    "expected":{"num":1,"errorCode":3003,"errorInfo":"uid and account not matches"},
                    "sql":"update user set
                             nickName='@{nickName}',
                             pwd='@{PBKDF|6,password}',
                             mobile='@{ENCODE|userKey,mobile}',
                             email='@{ENCODE|userKey,email}',
                             type='@{type}',
                             sex='@{sex}',
                             ustatus='N'
                         where id=@{uid} and account='@{account}'"
                }
            ]
        },
        {
            "name" : "create_search",
            "type" : "search",
            "db":"user",
            "action" : "put",
            "table":"user",
            "did" : "@{uid}",
            "title":"@{account}",
            "summary":"@{nickName}",
            "content":"@{SUBSTR|mobile,0,3} @{SUBSTR|mobile,7,4} @{SUBSTR|email,0,5}"
        }
    ],
    "response":[]
},

{
    "name": "remove",
    "method":"DELETE",
    "property" : "private",
    "feature" : "admin",
    "aclChecker" : "RBAC",
    "tokenChecker":"USER",
    "comment":"删除用户，遗忘权要求",

    "request": [
        {"name":"uid", "type":"int", "must":true, "comment":"用户ID"}
    ],

    "process" : [
        {
            "name" : "remove_user",
            "type":"rdb",
            "db":"user",
            //删除用户敏感信息，但是保留帐号基本信息
            "sqls" : [
                "update user set
                    email='',
                    mobile='',
                    birthday=0,
                    ustatus='R'
                where id=@{uid}",
                
                "delete from info where uid=@{uid}",
                "delete from powers where uid=@{uid}"
            ]
        },
        {
            "name":"remove_search",
            "type":"search",
            "db":"user",
            "action":"rmv",
            "table":"user",
            "did":"@{uid}"
        }
    ],
    "response":[]
},

{
    "name": "resetPwd",
    "method":"POST",
    "property" : "PRIVATE",
    "tokenChecker" : "USER",
    "feature" : "admin",
    "aclChecker" : "RBAC",
    "comment":"管理员重置密码",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":0, "comment":"用户ID"}
    ],
    
    "vars":[
        {"name":"newPwd", "toResp":true, "val":"@{RANDOM|s,6}"}
    ],

    "process" : [
        {
            "name" : "updatePwd",
            "type" : "rdb",
            "db":"user",
            "comment":"重置密码，admin密码不可以被重置，防止其他管理员恶意重置amdin密码",
            "sqls" : [
                {
                    "name":"updatePwd",
                    "sql":"update user set pwd='@{PBKDF|6,newPwd}' where id=@{uid} and id<>1"
                },
                {
                    "name":"removeToken",
                    "sql":"delete from token where uid=@{uid} and uid<>1"
                }
            ]
        }
    ],
    
    "response":[
        {"name":"newPwd", "type":"String", "comment":"新密码"}
    ]
},

{
    "name": "deActive",
    "method":"POST",
    "property" : "PRIVATE",
    "tokenChecker" : "USER",
    "feature" : "admin",
    "aclChecker" : "RBAC",
    "comment":"去激活用户，使得用户暂时无法使用，超级管理员不可以去激活",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":0, "comment":"用户ID"}
    ],
    "process" : [{
        "name" : "de_active",
        "type" : "rdb",
        "db":"user",
        "sqls" : [
            {
                "name":"update_status",
                "sql":"update user set ustatus='L' where id=@{uid} and id<>1" //admin不可以去激活
            },
            {
                "name":"remove_token",
                "sql":"delete from token where uid=@{uid} and uid<>1"
            }
        ]
    }],
    "response":[]
},

