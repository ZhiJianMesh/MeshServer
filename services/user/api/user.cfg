    "property" : "private",
    "tokenChecker" : "USER",
    "feature" : "admin",
    "aclChecker" : "RBAC",
    "comment":"设置指定用户附加信息。此请求来自终端,token是用户token",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":0, "comment":"用户ID"},
        {"name":"name", "type":"string", "must":true, "regular":"^[a-zA-Z0-9_]{1,100}$", "comment":"参数名"},
        {"name":"val", "type":"string", "must":true, "min":1, "max":4096, "comment":"参数值"}
    ],

    "process" : [
        {
            "name" : "setInfo",
            "type" : "rdb",
            "db":"user",
            "sqls" : [
